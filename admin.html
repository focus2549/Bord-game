<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - เพิ่มบอร์ดเกมใหม่</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap');
        body { font-family: 'Noto Sans Thai', sans-serif; background: #f1f5f9; }
    </style>
</head>
<body class="py-12">
    <div class="max-w-xl mx-auto bg-white p-10 rounded-[2.5rem] shadow-xl border border-slate-200">
        <div class="flex items-center gap-4 mb-8">
            <a href="index.html" class="text-blue-600 font-bold transition">← กลับหน้าหลัก</a>
            <h1 class="text-3xl font-black text-slate-800">เพิ่มเกมใหม่</h1>
        </div>
        <form id="add-game-form" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">ชื่อบอร์ดเกม</label>
                <input type="text" id="game-name" required class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">ลิงก์รูปภาพ</label>
                <input type="url" id="game-image" required class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">หมวดหมู่</label>
                <select id="game-category" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition">
                    <option value="ทั่วไป">ทั่วไป</option>
                    <option value="วางแผน">วางแผน</option>
                    <option value="ปาร์ตี้">ปาร์ตี้</option>
                    <option value="ผจญภัย">ผจญภัย</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">รายละเอียดเกม</label>
                <textarea id="game-details" rows="4" required placeholder="อธิบายวิธีการเล่น หรือเนื้อเรื่องของเกม..." 
                    class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition"></textarea>
            </div>
            <button type="submit" id="submit-btn" class="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-lg hover:bg-blue-700 transition-all">บันทึกลง Firebase</button>
        </form>
        <div id="status-msg" class="mt-6 text-center text-sm font-bold hidden"></div>
    </div>
    <script type="module" src="admin.js"></script>
</body>
</html>
